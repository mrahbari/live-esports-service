# Profile for real Abios Atlas (V3 REST). Overrides defaults when Atlas host needs Abios-Secret (case-study sandbox).
# Some networks cannot resolve api.abiosgaming.com; atlas.abiosgaming.com + /v3/series often works instead.
#
# Never commit ABIOS_API_KEY. Run: SPRING_PROFILES_ACTIVE=atlas ./scripts/run.sh  or ./scripts/run-atlas.sh
#
# Optional: LOG_UPSTREAM_PAYLOAD=true logs full upstream JSON (truncated) + one parse-shape line at INFO.
#
# To add Redis to readiness probe when CACHE_MODE=redis, override at runtime:
#   --management.health.redis.enabled=true
#   --management.endpoint.health.group.readiness.include=readinessState,abiosCache,redis

abios:
  v1-mock-enabled: false
  base-url: "https://atlas.abiosgaming.com"
  series-query: "filter=lifecycle<={live,ongoing}&include=participants.roster.team&include=participants.roster.line_up.players.player"
  lineups-path: "/v3/rosters"
  auth-header-name: Abios-Secret
  auth-header-format: "{token}"
  batch-size: 50
  max-series-pages: 10
  min-interval-ms: 100

app:
  live:
    # Pre-cache data every 60s so the user never feels the 8s enrichment delay
    background-refresh-ms: 60000
    cache-ttl-seconds: 60
    max-stale-ttl-seconds: 600

resilience4j:
  ratelimiter:
    instances:
      abiosOut:
        # Throttled sequential enrichment (5 per sec) to avoid Sandbox 429s
        limit-for-period: 300
  retry:
    instances:
      abios:
        # Avoid amplifying failed calls
        max-attempts: 2
        wait-duration: 300ms

logging:
  level:
    com.abioscase.live.integration.abios: INFO
