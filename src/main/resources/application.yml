server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
  forward-headers-strategy: native

spring:
  application:
    name: live-esports-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:esports}
    username: ${POSTGRES_USER:esports}
    password: ${POSTGRES_PASSWORD:esports}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2000
      timeout: 1000

# Abios Atlas integration. For the case-study key: set env ABIOS_API_KEY (never commit).
# Real calls: --spring.profiles.active=atlas  (see application-atlas.yml)
abios:
  v1-mock-enabled: true
  base-url: "https://api.abiosgaming.com"
  series-path: "/v3/series"
  series-query: "filter=lifecycle<={live,ongoing}"
  rosters-path: "/v3/rosters"
  rosters-query: "include=team&include=line_up.players.player"
  lineups-path: "/v3/lineups"
  lineups-query: "include=players"
  teams-path: "/v3/teams"
  teams-query: ""
  players-path: "/v3/players"
  players-query: ""
  live-polling-query: "filter=lifecycle<={live,ongoing}"
  upcoming-polling-query: "filter=lifecycle<=upcoming&ordering=start-asc"
  connect-timeout-ms: 3000
  read-timeout-ms: 8000
  auth-header-name: "Authorization"
  auth-header-format: "Bearer {token}"
  # Export ABIOS_API_KEY for real calls; with mock, leave empty
  api-key: ${ABIOS_API_KEY:}
  log-upstream-payload: ${LOG_UPSTREAM_PAYLOAD:false}

ingestion:
  series:
    window-days: ${INGESTION_WINDOW_DAYS:25}

app:
  live:
    cache-mode: ${CACHE_MODE:memory} # memory | redis
    cache-ttl-seconds: 20
    background-refresh-ms: 15000
    background-refresh-enabled: true
    max-stale-ttl-seconds: 300
    client-rate-limit-per-minute: 120
    client-burst-capacity: 120
  polling:
    enabled: true
    live-interval-ms: ${APP_POLLING_LIVE_INTERVAL_MS:3000}
    upcoming-interval-ms: ${APP_POLLING_UPCOMING_INTERVAL_MS:15000}
    max-upcoming-pages: 5
    ended-threshold-cycles: 3
    max-concurrent-calls: 4

# Outgoing: cap calls to Abios. Incoming: cap clients. Tune to your Atlas plan.
# https://abiosgaming.com/docs/en/content/atlas/2021-05-11/introduction/getting-started
resilience4j:
  ratelimiter:
    instances:
      abiosOut:
        limit-for-period: 30  # 30 requests per minute
        limit-refresh-period: 1m
        timeout-duration: 0s
      publicIn:
        limit-for-period: 200
        limit-refresh-period: 1m
        timeout-duration: 0s
  circuitbreaker:
    instances:
      abios:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        record-exceptions:
          - com.abioscase.live.integration.abios.exception.AbiosUpstreamException
          - org.springframework.web.client.RestClientException
  retry:
    instances:
      abios:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        randomized-wait-factor: 0.5
        retry-exceptions:
          - com.abioscase.live.integration.abios.exception.AbiosUpstreamTransientException
          - com.abioscase.live.integration.abios.exception.AbiosUpstreamRateLimitedException
          - org.springframework.web.client.RestClientException

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          # Redis excluded from default readiness — enable via CACHE_MODE=redis profile
          include: readinessState,abiosCache
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui
    try-it-out-enabled: true
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  structured:
    format:
      console: ecs
  file:
    name: ${LOG_FILE:./target/logs/app.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      clean-history-on-start: false
  level:
    com.abioscase.live: INFO
    # V1 (cache-backed): set LOG_V1_LEVEL=DEBUG|WARN|OFF to isolate stream path logs
    com.abioscase.live.livedata.application: ${LOG_V1_LEVEL:INFO}
    com.abioscase.live.livedata.cache: ${LOG_V1_LEVEL:INFO}
    com.abioscase.live.livedata.web.rest.SnapshotController: ${LOG_V1_LEVEL:INFO}
    # V2 (db-backed polling): set LOG_V2_LEVEL=DEBUG|WARN|OFF to isolate polling/ingestion logs
    com.abioscase.live.livedata.db: ${LOG_V2_LEVEL:INFO}
    com.abioscase.live.livedata.polling: ${LOG_V2_LEVEL:INFO}
    com.abioscase.live.livedata.web.rest.PollingController: ${LOG_V2_LEVEL:INFO}
    com.abioscase.live.upstream: DEBUG
