# Test overrides: disable external infrastructure that is not available in unit/MVC tests
spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

# Disable Redis health check for tests (Redis is not required to start)
management:
  health:
    redis:
      enabled: false

# Disable schedulers in tests to avoid table-not-found errors
app:
  live:
    background-refresh-enabled: false
    background-refresh-ms: 86400000
    background-refresh-initial-delay-ms: 86400000
  polling:
    enabled: false
